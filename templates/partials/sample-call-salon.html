<figure class="tl-frame tl-demo">

        <li class="tl-bubble tl-out" data-start="1.42" data-end="5.58"><span class="sr-only">Receptionist:</span> Thanks for calling North Nail Salon. I'm Jess's AI assistant. How can I help?</li>
        <li class="tl-bubble tl-in" data-start="6" data-end="9.14"><span class="sr-only">Caller:</span> Hi! Can I get a gel set this Saturday? How much is that?</li>
